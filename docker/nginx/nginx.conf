# docker/nginx/nginx.conf
# Self-contained Nginx configuration for the isolated Docker Compose environment.
# Uses container names (berea_backend, berea_frontend) as upstream addresses.
# Mount this file when running nginx as a standalone service within Docker without
# the modular conf.d split — useful for quick local testing or CI pipelines.

worker_processes auto;
pid            /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept       on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    server_tokens     off;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml font/woff2;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=120r/m;

    # ── Upstreams (Docker container names on berea_net) ───────────────────────
    upstream berea_backend {
        server berea_backend:8000;
        keepalive 32;
    }

    upstream berea_frontend {
        server berea_frontend:3000;
        keepalive 32;
    }

    # ── Server block ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        # Timeouts — generous for AI streaming responses
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Common proxy headers
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Auth endpoints — strict rate limit (brute-force protection)
        location ~ ^/api/v1/auth/(login|register) {
            limit_req        zone=auth_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass         http://berea_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # All other API routes
        location /api/ {
            limit_req        zone=api_zone burst=60 nodelay;
            proxy_pass         http://berea_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # FastAPI interactive docs (restrict in production via network rules)
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://berea_backend;
        }

        # Backend health probe (used by Docker healthcheck + external monitors)
        location = /health {
            proxy_pass http://berea_backend;
            access_log off;
        }

        # Next.js hot-reload WebSocket (dev only)
        location = /_next/webpack-hmr {
            proxy_pass         http://berea_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # Next.js immutable static assets — cache forever
        location ^~ /_next/static/ {
            proxy_pass http://berea_frontend;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Everything else → Next.js
        location / {
            proxy_pass         http://berea_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
