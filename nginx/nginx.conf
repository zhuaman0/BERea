# nginx/nginx.conf
# Primary Nginx configuration — global process settings, http defaults, and
# gzip / rate-limit zones shared across all server blocks.
# Server-specific rules live in conf.d/*.conf (included at the bottom).

worker_processes  auto;
worker_rlimit_nofile 65535;
pid               /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    server_tokens      off;

    # ── Client limits ────────────────────────────────────────────────────────
    client_max_body_size        50M;
    client_body_buffer_size     128k;
    client_header_buffer_size   4k;
    large_client_header_buffers 8 32k;
    client_header_timeout       15s;
    client_body_timeout         30s;
    send_timeout                30s;

    # ── Proxy global defaults ─────────────────────────────────────────────────
    proxy_buffering        on;
    proxy_buffer_size      8k;
    proxy_buffers          16 8k;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     120s;
    proxy_http_version     1.1;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_disable      "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        application/atom+xml
        application/vnd.ms-fontobject
        image/svg+xml
        font/truetype
        font/opentype
        font/woff
        font/woff2;

    # ── Security headers (applied globally; override per server block) ────────
    add_header X-Frame-Options        "DENY"                         always;
    add_header X-Content-Type-Options "nosniff"                      always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ── Rate-limiting zones ───────────────────────────────────────────────────
    # Shared memory zones — available to all server blocks in conf.d/
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m  rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m   rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # ── Include modular server blocks ─────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
