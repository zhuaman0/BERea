# nginx/conf.d/default.conf
# Default HTTP server block for BERea.
# Routes /api/* → FastAPI backend | everything else → Next.js frontend.
# Rate-limit zones and global proxy defaults are defined in ../nginx.conf.

# ── Upstream definitions ──────────────────────────────────────────────────────
# Container names must match the service names in docker/docker-compose.yml.
upstream berea_backend {
    server    berea_backend:8000;
    keepalive 32;
}

upstream berea_frontend {
    server    berea_frontend:3000;
    keepalive 32;
}

# ── HTTP server ───────────────────────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Common proxy headers
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Port   $server_port;

    # ── Auth endpoints: strict rate-limit ──────────────────────────────────────
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req        zone=auth_zone burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://berea_backend;
        proxy_set_header   Connection "";
    }

    # ── FastAPI: all other API routes ─────────────────────────────────────────
    location /api/ {
        limit_req        zone=api_zone burst=60 nodelay;
        limit_conn       conn_zone 20;

        proxy_pass       http://berea_backend;
        proxy_set_header Connection "";
    }

    # ── FastAPI: health check (internal monitoring + Docker healthcheck) ───────
    location = /health {
        proxy_pass http://berea_backend;
        access_log off;
    }

    # ── FastAPI: interactive docs ─────────────────────────────────────────────
    # Remove this block or restrict by IP in production.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://berea_backend;
    }

    # ── Next.js: HMR WebSocket (development hot-reload) ──────────────────────
    location = /_next/webpack-hmr {
        proxy_pass         http://berea_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_cache_bypass 1;
    }

    # ── Next.js: build output & static assets ────────────────────────────────
    # Content-addressed filenames → safe to cache permanently.
    location ^~ /_next/static/ {
        proxy_pass       http://berea_frontend;
        add_header       Cache-Control "public, max-age=31536000, immutable";
        access_log       off;
    }

    # ── Next.js: public/ directory assets ────────────────────────────────────
    location ^~ /static/ {
        proxy_pass  http://berea_frontend;
        add_header  Cache-Control "public, max-age=86400";
        access_log  off;
    }

    # ── Everything else → Next.js ─────────────────────────────────────────────
    location / {
        proxy_pass       http://berea_frontend;
        proxy_set_header Connection "";
    }
}
