name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — lint & typecheck
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --legacy-peer-deps: packages/ui-kit pins a newer React peer than frontend does.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test --workspace=frontend

  backend:
    name: Backend — lint, imports & voting tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vote_test
          POSTGRES_PASSWORD: vote_test
          POSTGRES_DB: vote_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vote_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: App imports cleanly
        run: python -c "import app.main"
      - name: Voting integration tests
        run: python -m pytest tests -q --vote-test-db postgresql+asyncpg://vote_test:vote_test@localhost:5432/vote_test

  commit-messages:
    name: Commit message format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit in the PR
        run: |
          pattern='^(feat|fix|refactor|chore|docs|test|style)(\([a-z0-9-]+\))?: .+'
          status=0
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"); do
            subject=$(git log -1 --format=%s "$sha")
            if ! printf '%s' "$subject" | grep -Eq "$pattern" || [ "${#subject}" -gt 72 ]; then
              echo "::error::$sha — '$subject' doesn't match <type>(<scope>): <description> (≤72 chars)"
              status=1
            fi
          done
          exit $status
